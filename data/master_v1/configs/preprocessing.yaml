# Canonical Preprocessing Configuration (Version 1.0)
# Frozen scientific contract for all baseline, data-centric, CBM, and hybrid runs.

preprocessing_version: "v1_roi_margin10_letterbox64"

input_resolution:
  target_height: 64
  target_width: 64
  channels: 3
  color_space: "RGB"

roi_crop:
  enabled: true
  coordinate_convention: "inclusive_xyxy_zero_indexed"  # Roi.X1, Roi.Y1, Roi.X2, Roi.Y2
  margin_ratio: 0.10  # 10% context margin expanded around ROI bounding box
  clamp_to_image_bounds: true

scaling_and_aspect_ratio:
  policy: "proportional_letterbox"
  interpolation: "bilinear"  # PIL.Image.Resampling.BILINEAR
  scale_factor_rule: "min(target_w / crop_w, target_h / crop_h)"

padding:
  policy: "symmetric_zero_padding"
  fill_value: [0, 0, 0]  # Neutral black canvas
  alignment: "center"     # Equal padding left/right and top/bottom

splits:
  source_dataset: "GTSRB (German Traffic Sign Recognition Benchmark)"
  train_split_policy: "stratified_group_kfold_by_track"
  train_ratio: 0.80
  val_ratio: 0.20
  split_seed: 42
  grouping_key: "class_id + '_' + track_id"
  test_split_policy: "held_out_official_gtsrb_test_csv"  # 12,630 samples, strictly untouched

